<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#173f33">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>try{var t=localStorage.getItem('stock_theme')}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')</script>
<style>
:root{
  --bg:#f2efe9;--surface:#fff;--soft:#f8f6f1;--ink:#1c1a17;--muted:#6f695f;--line:#e5e0d6;
  --hdr:#173f33;--hdr-ink:#f3efe6;
  --accent:#1f5c4a;--accent-ink:#fff;--clay:#c2693c;
  --warn:#8f5200;--warn-bg:#fcecc8;--bad:#a3281f;--bad-bg:#fbe1dd;--ok:#1b5a45;--ok-bg:#d9efe4;
  --shadow:0 1px 2px rgba(28,26,23,.06),0 4px 14px rgba(28,26,23,.05);
  --r:10px;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#12110f;--surface:#1c1b18;--soft:#23221e;--ink:#f0ede6;--muted:#a39d91;--line:#36332d;
  --hdr:#0e231c;--hdr-ink:#f0ede6;
  --accent:#62b89b;--accent-ink:#0d1f18;--clay:#e08a5b;
  --warn:#f0b955;--warn-bg:#3a2c10;--bad:#ff958c;--bad-bg:#3d1b18;--ok:#86d4b6;--ok-bg:#173126;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
svg{width:1.1em;height:1.1em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* header */
header{background:var(--hdr);color:var(--hdr-ink);position:sticky;top:0;z-index:5}
.hd{max-width:1180px;margin:0 auto;padding:.75rem 1rem;display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.25rem}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:700;font-size:1.1rem;letter-spacing:.01em}
.logo{width:34px;height:34px;border-radius:9px;background:var(--clay);display:grid;place-items:center;color:#fff}
.logo svg{width:20px;height:20px}
nav{display:flex;gap:.25rem;background:rgba(255,255,255,.08);padding:.25rem;border-radius:99px}
nav button{display:flex;align-items:center;gap:.4rem;border:0;background:none;padding:.4rem .9rem;border-radius:99px;color:inherit;opacity:.75;font:inherit;cursor:pointer}
nav button:hover{opacity:1}
nav button[aria-selected=true]{background:var(--hdr-ink);color:var(--hdr);opacity:1;font-weight:600}
.spacer{flex:1}
.hd .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18);color:var(--hdr-ink)}
.hd .btn:hover{background:rgba(255,255,255,.16)}
.hd .btn.primary{background:var(--clay);border-color:var(--clay);color:#fff}
.hd .btn.primary:hover{filter:brightness(1.08)}

main{max-width:1180px;margin:0 auto;padding:1.25rem 1rem 5rem}
button,input,select{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface);padding:.5rem .8rem;border-radius:8px;cursor:pointer;transition:background .12s,border-color .12s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{padding:.3rem .55rem;font-size:.85rem;border-radius:7px}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover:not(:disabled){background:var(--soft);border-color:var(--line)}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.5rem .65rem;width:100%}
input:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted)}
label>input,label>select{margin-top:.25rem;color:var(--ink);font-weight:400}

/* títulos */
.ph{display:flex;align-items:baseline;gap:.75rem;margin:0 0 1rem}
.ph h2{margin:0;font-size:1.35rem}
.ph span{color:var(--muted);font-size:.9rem}
h3.sec{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 .6rem}

/* estadísticas */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.85rem;margin-bottom:1.25rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem;box-shadow:var(--shadow);display:flex;gap:.85rem;align-items:center}
.ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--ok-bg);color:var(--ok)}
.ico svg{width:22px;height:22px}
.ico.c2{background:#e7ecf9;color:#2f4a9a}.ico.c3{background:#fbe9de;color:#a4501f}.ico.c4{background:#efe5f7;color:#6b3a94}.ico.c5{background:var(--warn-bg);color:var(--warn)}
[data-theme=dark] .ico.c2{background:#1e2742;color:#9db4f5}[data-theme=dark] .ico.c3{background:#3a2316;color:#f0a77a}[data-theme=dark] .ico.c4{background:#2c2038;color:#cfa6ef}
.stat b{display:block;font-size:1.45rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.82rem}

.cols{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:1.25rem;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:1rem;margin-bottom:1.25rem}
.panel>:last-child{margin-bottom:0}

/* barras por categoría */
.cat{margin-bottom:.75rem}
.cat .l{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:.25rem}
.cat .l span{color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:hsl(var(--h) 45% 45%)}

/* feed de movimientos */
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:.65rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line)}
.feed li:last-child{border:0}
.feed .t{flex:1;min-width:0;font-size:.88rem}
.feed .t small{display:block;color:var(--muted)}
.dl{font-weight:700;font-variant-numeric:tabular-nums}
.dl.pos{color:var(--ok)}.dl.neg{color:var(--clay)}.dl.zero{color:var(--muted)}

/* filtros */
.bar{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.85rem;align-items:center}
.search{position:relative;flex:1 1 240px}
.search svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:2.2rem}
.bar select{width:auto}
.chk{display:flex;align-items:center;gap:.4rem;font-size:.9rem;font-weight:400;color:var(--ink);cursor:pointer}
.chk input{width:auto;margin:0}

/* tablas */
.wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:680px}
th,td{text-align:left;padding:.7rem .85rem;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--soft)}
tbody tr:hover{background:var(--soft)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.prod{display:flex;align-items:center;gap:.7rem}
.prod small{display:block;color:var(--muted);font-size:.8rem}
.av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:.85rem;background:hsl(var(--h) 40% 88%);color:hsl(var(--h) 55% 24%)}
[data-theme=dark] .av{background:hsl(var(--h) 25% 22%);color:hsl(var(--h) 55% 78%)}[data-theme=dark] .track i{background:hsl(var(--h) 45% 58%)}
.var{display:inline-flex;gap:.35rem;align-items:center}
.sw{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:.05rem .45rem;font-size:.82rem}
.stk{display:flex;align-items:center;gap:.6rem;justify-content:flex-end}
.stk b{min-width:1.6rem;text-align:right}
.meter{width:64px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px}
.ok .meter i,.meter i.ok{background:var(--ok)}.meter i.low{background:#e0a21b}.meter i.out{background:var(--bad)}
.tag{display:inline-flex;align-items:center;gap:.3rem;padding:.15rem .6rem;border-radius:99px;font-size:.76rem;font-weight:700}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.low{background:var(--warn-bg);color:var(--warn)}.tag.out{background:var(--bad-bg);color:var(--bad)}
.tag.in{background:var(--ok-bg);color:var(--ok)}.tag.outm{background:#fbe9de;color:#a4501f}.tag.set{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
[data-theme=dark] .tag.outm{background:#3a2316;color:#f0a77a}
#th .sun{display:none}[data-theme=dark] #th .sun{display:block}[data-theme=dark] #th .moon{display:none}
.acts{display:flex;gap:.25rem;justify-content:flex-end}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--muted)}
.empty svg{width:2.2rem;height:2.2rem;display:block;margin:0 auto .5rem;opacity:.6}
.panel .empty{padding:1rem}

/* diálogos */
dialog{border:0;border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(580px,calc(100vw - 2rem));box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,12,.55);backdrop-filter:blur(2px)}
dialog form{padding:1.4rem}
dialog h3{margin:0 0 1.1rem;font-size:1.15rem}
dialog h4{margin:1.25rem 0 .5rem;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem}
.grid .full{grid-column:1/-1}
.vrow{display:grid;grid-template-columns:1fr 1fr .8fr .8fr auto;gap:.4rem;margin-bottom:.5rem;align-items:end;padding:.6rem;background:var(--soft);border-radius:9px}
.vrow label{font-size:.72rem}
.foot{display:flex;gap:.5rem;align-items:center;margin-top:1.25rem}
.err{color:var(--bad);font-size:.85rem;margin:.6rem 0 0;min-height:1.2em}
@media(max-width:560px){.grid{grid-template-columns:1fr}.vrow{grid-template-columns:1fr 1fr}.vrow .x{grid-column:1/-1}}

/* aviso */
#toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%) translateY(150%);background:var(--ink);color:var(--bg);padding:.65rem .65rem .65rem 1rem;border-radius:10px;display:flex;gap:.9rem;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.3);transition:transform .2s;z-index:20;max-width:calc(100vw - 2rem)}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast button{background:none;border:0;color:var(--clay);font-weight:700;cursor:pointer;padding:.2rem .4rem}

/* animaciones */
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes flash{from{background:color-mix(in srgb,var(--clay) 30%,transparent)}}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.enter .stat,.enter .panel,.enter .wrap,.enter .ph,.enter .bar,.enter tbody tr,.enter .feed li{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 45ms)}
.enter .track i,.enter .meter i{transform-origin:left;animation:grow .9s .25s cubic-bezier(.2,.7,.2,1) both}
.enter .wrap{animation-name:rise}
.enter .wrap tbody tr{animation-delay:calc(var(--i,0) * 35ms + 120ms)}
tr.flash{animation:flash 1.3s ease-out}
.stat{transition:transform .18s,box-shadow .18s}
.stat:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(28,26,23,.08),0 10px 24px rgba(28,26,23,.1)}
.btn:active:not(:disabled){transform:scale(.95)}
.btn{transition:background .12s,border-color .12s,transform .1s}
.vrow{animation:pop .25s both}
.meter i{transition:width .5s cubic-bezier(.2,.7,.2,1)}
.logo{transition:transform .3s}.brand:hover .logo{transform:rotate(-8deg) scale(1.08)}
dialog{opacity:0;transform:translateY(14px) scale(.97);transition:opacity .22s,transform .22s,overlay .22s allow-discrete,display .22s allow-discrete}
dialog[open]{opacity:1;transform:none}
@starting-style{dialog[open]{opacity:0;transform:translateY(14px) scale(.97)}}
dialog::backdrop{opacity:0;transition:opacity .22s,overlay .22s allow-discrete,display .22s allow-discrete}
dialog[open]::backdrop{opacity:1}
@starting-style{dialog[open]::backdrop{opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

[hidden]{display:none!important}
/* menú ⋯ */
.more{position:relative}
.more summary{list-style:none;padding:.5rem .65rem}
.more summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:calc(100% + .4rem);width:230px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.25);padding:.35rem;z-index:30;animation:pop .15s both}
.mi{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;min-height:44px;padding:.5rem .7rem;border:0;background:none;border-radius:8px;cursor:pointer}
.mi:hover{background:var(--soft)}
.bn{display:none}

/* ===== móvil (≤720px) ===== */
@media (max-width:720px){
  body{font-size:16px}
  main{padding:1rem .875rem calc(6rem + env(safe-area-inset-bottom))}
  .hd{padding:.6rem .875rem;gap:.5rem;flex-wrap:nowrap}
  .brand{font-size:1rem}
  .hd .btn{min-height:42px}
  .hd #new{padding:.5rem .8rem}
  /* pestañas abajo, estilo app */
  nav{position:fixed;left:0;right:0;bottom:0;border-radius:0;padding:.35rem .5rem calc(.35rem + env(safe-area-inset-bottom));background:var(--hdr);border-top:1px solid rgba(255,255,255,.12);gap:.25rem;z-index:10}
  nav button{flex:1;flex-direction:column;gap:.15rem;padding:.45rem .25rem;font-size:.72rem;border-radius:12px;min-height:52px;justify-content:center}
  nav button svg{width:1.4em;height:1.4em}
  input,select{font-size:16px;min-height:44px}
  .chk input{min-height:0;width:1.25rem;height:1.25rem}
  .btn{min-height:42px}
  .btn.sm{min-height:42px;padding:.35rem .75rem}
  .ph h2{font-size:1.2rem}
  /* tarjetas de estadísticas: 2 columnas, ícono arriba */
  .stats{grid-template-columns:1fr 1fr;gap:.6rem}
  .stat{flex-direction:column;align-items:flex-start;gap:.5rem;padding:.8rem}
  .stat:last-child:nth-child(odd){grid-column:1/-1}
  .stat b{font-size:1.2rem}
  .ico{width:36px;height:36px}
  .stat:hover{transform:none}
  /* filtros */
  .search{flex-basis:100%}
  .bar select{flex:1}
  /* tablas → tarjetas */
  .wrap{overflow:visible}
  table{min-width:0}
  thead{display:none}
  table,tbody,tr,td{display:block}
  tr{display:grid;grid-template-columns:1fr 1fr;gap:.55rem .75rem;padding:.9rem;border-bottom:1px solid var(--line)}
  tr:last-child{border-bottom:0}
  td{padding:0;border:0;white-space:normal;text-align:left!important}
  td[data-label]::before{content:attr(data-label);display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:.15rem}
  td.pc{order:-1;grid-column:1/-1}
  td.pc,td.ac,td.full{grid-column:1/-1}
  td.hm{display:none}
  .stk{justify-content:flex-start}
  .meter{width:80px}
  .acts{justify-content:stretch;gap:.5rem}
  .acts .btn{flex:1;justify-content:center}
  tbody tr:hover{background:none}
  /* ventanas como hoja inferior */
  dialog{width:100%;max-width:none;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:92dvh;transform:translateY(40px)}
  @starting-style{dialog[open]{transform:translateY(40px)}}
  dialog form{padding:1.1rem .95rem calc(1rem + env(safe-area-inset-bottom))}
  .foot{position:sticky;bottom:calc(-1rem - env(safe-area-inset-bottom));background:var(--surface);padding-top:.75rem;margin-bottom:-.25rem}
  .foot .btn{flex:1;justify-content:center}
  .foot .spacer{display:none}
  .lrow{grid-template-columns:1fr 84px}
  .menu{position:fixed;left:.875rem;right:.875rem;top:auto;bottom:calc(5.5rem + env(safe-area-inset-bottom));width:auto}
  #toast{bottom:calc(5.5rem + env(safe-area-inset-bottom))}
}

/* etiquetas */
.lrow{display:grid;grid-template-columns:1fr 90px;gap:.75rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line)}
.lrow small{display:block;color:var(--muted)}
#lrows{max-height:45vh;overflow:auto;margin:.75rem 0}
#print{display:none}
.lab{width:var(--lw);height:var(--lh);border:.2mm dashed #888;padding:calc(var(--lh) * .06) calc(var(--lh) * .08);display:flex;flex-direction:column;justify-content:space-between;color:#000;background:#fff;overflow:hidden;break-inside:avoid;font-size:calc(var(--lh) * .11);line-height:1.15}
.lab .bc svg{display:block;stroke:none;fill:#000;width:100%;height:calc(var(--lh) * .15)}
.lab b{display:block;overflow:hidden;max-height:2.3em}
.lab .v{font-size:.9em}
.lab .p{font-size:calc(var(--lh) * .22);font-weight:800;line-height:1}
.lab .c{font-size:.65em;color:#444;display:flex;justify-content:space-between}
@media print{
  @page{margin:6mm}
  body>*:not(#print){display:none!important}
  body{background:#fff!important}
  #print{display:grid!important;grid-template-columns:repeat(auto-fill,var(--lw))}
}
</style>
</head>
<body>
<header><div class="hd">
  <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg></span>Stock</div>
  <nav role="tablist" aria-label="Secciones">
    <button role="tab" data-tab="resumen" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8M5 10v10h14V10"/></svg>Resumen</button>
    <button role="tab" data-tab="inventario" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Inventario</button>
    <button role="tab" data-tab="movimientos" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>Movimientos</button>
  </nav>
  <span class="spacer"></span>
  <button class="btn" id="th" aria-label="Cambiar modo claro/oscuro" title="Modo claro/oscuro"><svg class="moon" viewBox="0 0 24 24"><path d="M21 13A9 9 0 1111 3a7 7 0 0010 10z"/></svg><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
  <details class="more"><summary class="btn" aria-label="Más opciones"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></summary>
    <div class="menu">
      <button class="mi" id="inst" hidden><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Instalar app</button>
      <button class="mi" id="lb"><svg viewBox="0 0 24 24"><path d="M3 12V3h9l9 9-9 9-9-9zM7.5 7.5h.01"/></svg>Imprimir etiquetas</button>
      <button class="mi" id="csv"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Exportar CSV</button>
      <button class="mi" id="bk"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5V4zM8 4v5h7V4M8 20v-6h8v6"/></svg>Respaldo (JSON)</button>
      <button class="mi" id="rs"><svg viewBox="0 0 24 24"><path d="M12 21V9M7 14l5-5 5 5M4 4h16"/></svg>Restaurar respaldo</button>
    </div></details>
  <input type="file" id="file" accept="application/json" hidden>
  <button class="btn primary" id="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Producto</button>
</div></header>
<main id="view"></main>
<div id="toast" role="status"><span id="tmsg"></span><button id="tund" hidden>Deshacer</button></div>

<dialog id="dp"><form method="dialog" id="fp">
  <h3 id="dpt">Producto</h3>
  <div class="grid">
    <label class="full">Nombre<input name="name" required maxlength="80" placeholder="Remera básica algodón"></label>
    <label>Categoría<input name="cat" list="cats" required maxlength="40" placeholder="Remeras"></label>
    <label>Marca<input name="brand" maxlength="40"></label>
    <label>Costo ($)<input name="cost" type="number" min="0" step="any" value="0"></label>
    <label>Precio de venta ($)<input name="price" type="number" min="0" step="any" value="0"></label>
  </div>
  <datalist id="cats"></datalist>
  <h4>Talles y colores</h4>
  <div id="vrows"></div>
  <button type="button" class="btn sm" id="addv">+ Agregar variante</button>
  <p class="err" id="ep" role="alert"></p>
  <div class="foot"><button type="button" class="btn danger" id="delp" hidden>Eliminar producto</button><span class="spacer"></span><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" value="ok">Guardar</button></div>
</form></dialog>

<dialog id="dm"><form method="dialog" id="fm">
  <h3 id="dmt">Movimiento</h3>
  <div class="grid">
    <label>Tipo<select name="type"><option value="out">Venta / salida</option><option value="in">Ingreso</option><option value="set">Ajustar a cantidad exacta</option></select></label>
    <label>Cantidad<input name="qty" type="number" min="0" step="1" value="1" required></label>
    <label class="full">Nota (opcional)<input name="note" maxlength="80" placeholder="Cliente, proveedor, conteo…"></label>
  </div>
  <p class="err" id="em" role="alert"></p>
  <div class="foot"><span class="spacer"></span><button type="button" class="btn" data-close>Cancelar</button><button class="btn primary" value="ok">Confirmar</button></div>
</form></dialog>

<dialog id="dl"><form method="dialog">
  <h3>Imprimir etiquetas</h3>
  <div class="grid">
    <label>Tamaño<select id="lsize"><option value="50x30">50 × 30 mm</option><option value="70x40">70 × 40 mm</option><option value="40x25">40 × 25 mm</option></select></label>
    <label>Acciones rápidas<span style="display:flex;gap:.4rem;margin-top:.25rem"><button type="button" class="btn sm" id="lstock">Copias = stock</button><button type="button" class="btn sm" id="lclear">Limpiar</button></span></label>
  </div>
  <div id="lrows"></div>
  <p class="err" id="el" role="alert"></p>
  <div class="foot"><span class="spacer"></span><button type="button" class="btn" data-close>Cancelar</button><button type="button" class="btn primary" id="lgo">Imprimir</button></div>
</form></dialog>
<div id="print" aria-hidden="true"></div>

<script>
const KEY ='gestion_stock_v1';
let db = load(), tab = 'resumen', filt = {q:'', cat:'', low:false};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n || 0);
const uid = () => Math.random().toString(36).slice(2, 10);
const hue = s => [...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
const ini = s => String(s).trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase() || '?';
const I = {
  box:'<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/>', layers:'<path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/>',
  cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>', tag:'<path d="M3 12V3h9l9 9-9 9-9-9zM7.5 7.5h.01"/>',
  alert:'<path d="M12 3l10 18H2L12 3zM12 10v5M12 18h.01"/>', trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>', edit:'<path d="M4 20h4L20 8l-4-4L4 16v4z"/>', swap:'<path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/>',
};
const ic = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${I[k]}</svg>`;

function load(){
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.products) && Array.isArray(d.moves)) { d.moves.forEach(m => m.id ||= uid()); return d; } } catch {}
  return {products: [], moves: []};
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(db)); }
  catch { alert('No se pudo guardar: el navegador bloqueó el almacenamiento. Hacé un respaldo.'); }
}
const rows = () => db.products.flatMap(p => p.variants.map(v => ({p, v})));
const status = v => v.qty <= 0 ? 'out' : v.qty <= v.min ? 'low' : 'ok';
const STXT = {ok:'OK', low:'Bajo', out:'Sin stock'};
const tag = v => `<span class="tag ${status(v)}">${STXT[status(v)]}</span>`;
const vlabel = v => [v.size, v.color].filter(Boolean).join(' · ') || 'Único';

function move(pid, vid, type, qty, note){
  const p = db.products.find(x => x.id === pid), v = p?.variants.find(x => x.id === vid);
  if (!v) return 'Variante inexistente';
  qty = Math.floor(Number(qty));
  if (!Number.isFinite(qty) || qty < 0) return 'Cantidad inválida';
  let delta = type === 'in' ? qty : type === 'out' ? -qty : qty - v.qty;
  if (type !== 'set' && qty === 0) return 'La cantidad debe ser mayor a 0';
  if (v.qty + delta < 0) return `Solo hay ${v.qty} en stock`;
  v.qty += delta;
  const m = {id: uid(), t: Date.now(), pid, vid, name: p.name, var: vlabel(v), type, delta, note: note || ''};
  db.moves.unshift(m);
  db.moves.length = Math.min(db.moves.length, 2000);
  save();
  return m;
}
// Elimina un movimiento y revierte su efecto en el stock (si la variante todavía existe).
function delMove(id){
  const i = db.moves.findIndex(m => m.id === id); if (i < 0) return '';
  const m = db.moves[i], v = db.products.find(p => p.id === m.pid)?.variants.find(x => x.id === m.vid);
  if (v) {
    if (v.qty - m.delta < 0) return 'No se puede eliminar: el stock quedaría negativo (hay movimientos posteriores).';
    v.qty -= m.delta;
  }
  db.moves.splice(i, 1); save(); return '';
}

/* ---------- aviso ---------- */
let tt;
function toast(msg, undo){
  $('#tmsg').textContent = msg; const b = $('#tund'); b.hidden = !undo; b.onclick = () => { undo(); $('#toast').classList.remove('on'); };
  $('#toast').classList.add('on'); clearTimeout(tt); tt = setTimeout(() => $('#toast').classList.remove('on'), 5000);
}

/* ---------- vistas ---------- */
let anim = true, flash = null; // anim: solo animar la entrada al cambiar de pestaña (no en cada tecla de la búsqueda)
const reduced = matchMedia('(prefers-reduced-motion:reduce)').matches;
function render(){
  document.querySelectorAll('nav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  const v = $('#view');
  v.innerHTML = tab === 'resumen' ? vResumen() : tab === 'inventario' ? vInv() : vMoves();
  if (tab === 'inventario') $('#q').value = filt.q;
  v.classList.toggle('enter', anim);
  if (anim) {
    v.querySelectorAll('.stat,.panel,.ph,.bar,.wrap,tbody tr,.feed li').forEach((el, i) => el.style.setProperty('--i', Math.min(i, 14)));
    if (!reduced) v.querySelectorAll('.stat b[data-n]').forEach(countUp);
  }
  if (flash) { v.querySelectorAll(`tr[data-vid="${flash}"]`).forEach(r => r.classList.add('flash')); flash = null; }
  anim = false;
}
function countUp(el){
  const to = +el.dataset.n, fmt = el.dataset.m ? money : String, t0 = performance.now();
  const step = t => { const k = Math.min(1, (t - t0) / 700); el.textContent = fmt(Math.round(to * (1 - (1 - k) ** 3))); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const empty = (k, t) => `<div class="empty">${ic(k)}${t}</div>`;
function vResumen(){
  const r = rows(), units = r.reduce((a,{v}) => a + v.qty, 0);
  const cost = r.reduce((a,{p,v}) => a + v.qty * p.cost, 0), retail = r.reduce((a,{p,v}) => a + v.qty * p.price, 0);
  const alerts = r.filter(({v}) => status(v) !== 'ok').sort((a,b) => a.v.qty - b.v.qty);
  const byCat = {}; r.forEach(({p,v}) => byCat[p.cat] = (byCat[p.cat] || 0) + v.qty);
  const cats = Object.entries(byCat).sort((a,b) => b[1] - a[1]), max = Math.max(1, ...cats.map(c => c[1]));
  const S = (c, k, n, l, m) => `<div class="stat"><span class="ico ${c}">${ic(k)}</span><div><b data-n="${n}" ${m ? 'data-m="1"' : ''}>${m ? money(n) : n}</b><span>${l}</span></div></div>`;
  return `<div class="stats">${S('', 'box', db.products.length, 'Productos')}${S('c2', 'layers', units, 'Unidades en stock')}
    ${S('c3', 'cash', cost, 'Valor a costo', 1)}${S('c4', 'tag', retail, 'Valor a precio de venta', 1)}${S('c5', 'alert', alerts.length, 'Variantes a reponer')}</div>
  <div class="cols"><div><h3 class="sec">A reponer</h3>` +
    (alerts.length ? table(alerts) : `<div class="wrap">${empty('box', r.length ? 'Todo el stock está por encima del mínimo.' : 'Todavía no cargaste productos. Tocá “Producto” para empezar.')}</div>`) +
  `</div><div><div class="panel"><h3 class="sec">Unidades por categoría</h3>` +
    (cats.length ? cats.map(([c,n]) => `<div class="cat"><div class="l">${esc(c)}<span>${n} u.</span></div><div class="track"><i style="--h:${hue(c)};width:${n / max * 100}%"></i></div></div>`).join('') : '<div class="empty">Sin datos</div>') +
  `</div><div class="panel"><h3 class="sec">Últimos movimientos</h3>` +
    (db.moves.length ? `<ul class="feed">${db.moves.slice(0, 5).map(m => `<li><span class="av" style="--h:${hue(m.name)}">${esc(ini(m.name))}</span>
      <span class="t">${esc(m.name)}<small>${esc(m.var)}</small></span>${dl(m.delta)}</li>`).join('')}</ul>` : '<div class="empty">Sin movimientos</div>') + `</div></div></div>`;
}
const dl = d => `<span class="dl ${d > 0 ? 'pos' : d < 0 ? 'neg' : 'zero'}">${d > 0 ? '+' : ''}${d}</span>`;
function table(list){
  return `<div class="wrap"><table><thead><tr><th>Producto</th><th>Variante</th><th class="n">Stock</th><th class="n">Mín.</th><th>Estado</th><th class="n">Precio</th><th></th></tr></thead><tbody>` +
  list.map(({p,v}) => `<tr data-vid="${v.id}"><td class="pc"><div class="prod"><span class="av" style="--h:${hue(p.cat)}">${esc(ini(p.name))}</span><div>${esc(p.name)}<small>${esc(p.cat)}${p.brand ? ' · ' + esc(p.brand) : ''}</small></div></div></td>
    <td data-label="Variante">${[v.size, v.color].filter(Boolean).map(x => `<span class="sw">${esc(x)}</span>`).join(' ') || '<span class="sw">Único</span>'}</td>
    <td class="n" data-label="Stock"><div class="stk"><b>${v.qty}</b><span class="meter"><i class="${status(v)}" style="width:${Math.min(100, v.qty / Math.max(v.min * 3, 6) * 100)}%"></i></span></div></td>
    <td class="n hm">${v.min}</td><td data-label="Estado">${tag(v)}</td><td class="n" data-label="Precio">${money(p.price)}</td>
    <td class="ac"><div class="acts"><button class="btn sm" data-sell="${p.id}|${v.id}" ${v.qty ? '' : 'disabled'} aria-label="Vender 1 de ${esc(p.name)} ${esc(vlabel(v))}">−1</button>
    <button class="btn sm" data-mov="${p.id}|${v.id}" aria-label="Registrar movimiento">${ic('swap')}Mover</button>
    <button class="btn sm ghost" data-edit="${p.id}" aria-label="Editar ${esc(p.name)}">${ic('edit')}</button></div></td></tr>`).join('') + `</tbody></table></div>`;
}
function vInv(){
  const cats = [...new Set(db.products.map(p => p.cat))].sort(), q = filt.q.toLowerCase();
  const list = rows().filter(({p,v}) => (!filt.cat || p.cat === filt.cat) && (!filt.low || status(v) !== 'ok') &&
    (!q || (p.name + ' ' + p.brand + ' ' + p.cat + ' ' + vlabel(v)).toLowerCase().includes(q)));
  return `<div class="ph"><h2>Inventario</h2><span>${list.length} variantes</span></div>
    <div class="bar"><div class="search">${ic('search')}<input id="q" type="search" placeholder="Buscar producto, marca, talle, color…" aria-label="Buscar"></div>
    <select id="fc" aria-label="Categoría"><option value="">Todas las categorías</option>${cats.map(c => `<option ${c === filt.cat ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
    <label class="chk"><input type="checkbox" id="fl" ${filt.low ? 'checked' : ''}> Solo bajo stock</label></div>` +
    (list.length ? table(list) : `<div class="wrap">${empty('box', db.products.length ? 'Nada coincide con el filtro.' : 'Sin productos. Tocá “Producto”.')}</div>`);
}
function vMoves(){
  const T = {in:['in','Ingreso'], out:['outm','Salida'], set:['set','Ajuste']};
  const head = `<div class="ph"><h2>Movimientos</h2><span>${db.moves.length} registrados</span></div>`;
  if (!db.moves.length) return head + `<div class="wrap">${empty('swap', 'Sin movimientos todavía.')}</div>`;
  return head + `<div class="wrap"><table><thead><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th class="n">Cantidad</th><th>Nota</th><th></th></tr></thead><tbody>` +
    db.moves.slice(0, 200).map(m => `<tr><td data-label="Fecha">${new Date(m.t).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'})}</td>
    <td class="pc"><div class="prod"><span class="av" style="--h:${hue(m.name)}">${esc(ini(m.name))}</span><div>${esc(m.name)}<small>${esc(m.var)}</small></div></div></td>
    <td data-label="Tipo"><span class="tag ${T[m.type][0]}">${T[m.type][1]}</span></td><td class="n" data-label="Cantidad">${dl(m.delta)}</td><td class="${m.note ? 'full' : 'hm'}" data-label="Nota">${esc(m.note)}</td>
    <td class="ac"><div class="acts"><button class="btn sm ghost danger" data-delmov="${m.id}" aria-label="Eliminar movimiento" title="Eliminar y revertir el stock">${ic('trash')}</button></div></td></tr>`).join('') + `</tbody></table></div>`;
}

/* ---------- producto ---------- */
let editing = null;
function vrow(v = {}){
  const d = document.createElement('div'); d.className = 'vrow'; d.dataset.vid = v.id || '';
  d.innerHTML = `<label>Talle<input name="size" maxlength="12" placeholder="M / 42" value="${esc(v.size)}"></label>
    <label>Color<input name="color" maxlength="20" value="${esc(v.color)}"></label>
    <label>${v.id ? 'Stock' : 'Stock inicial'}<input name="qty" type="number" min="0" step="1" value="${v.qty ?? 0}" ${v.id ? 'disabled title="Usá Mover para cambiar el stock"' : ''}></label>
    <label>Mínimo<input name="min" type="number" min="0" step="1" value="${v.min ?? 1}"></label>
    <button type="button" class="btn sm danger x" aria-label="Quitar variante">Quitar</button>`;
  d.querySelector('.x').onclick = () => d.remove();
  $('#vrows').append(d);
}
function openProduct(id){
  editing = db.products.find(p => p.id === id) || null;
  const f = $('#fp'); f.reset(); $('#vrows').innerHTML = ''; $('#ep').textContent = '';
  $('#dpt').textContent = editing ? 'Editar producto' : 'Nuevo producto';
  $('#cats').innerHTML = [...new Set(db.products.map(p => p.cat))].map(c => `<option value="${esc(c)}">`).join('');
  if (editing){ for (const k of ['name','cat','brand','cost','price']) f.elements[k].value = editing[k]; editing.variants.forEach(vrow); }
  else vrow();
  $('#delp').hidden = !editing;
  $('#dp').showModal();
}
$('#delp').onclick = () => {
  if (!confirm(`¿Eliminar "${editing.name}" y todas sus variantes? El historial de movimientos se conserva.`)) return;
  db.products = db.products.filter(p => p !== editing); save(); $('#dp').close(); render();
};
$('#fp').addEventListener('submit', e => {
  if (e.submitter?.value !== 'ok') return;
  const f = e.target.elements, err = $('#ep');
  const vs = [...document.querySelectorAll('.vrow')].map(r => ({
    id: r.dataset.vid, size: r.querySelector('[name=size]').value.trim(), color: r.querySelector('[name=color]').value.trim(),
    qty: Math.max(0, Math.floor(+r.querySelector('[name=qty]').value) || 0), min: Math.max(0, Math.floor(+r.querySelector('[name=min]').value) || 0)}));
  const keys = vs.map(v => (v.size + '|' + v.color).toLowerCase());
  if (!vs.length) { e.preventDefault(); err.textContent = 'Agregá al menos una variante.'; return; }
  if (new Set(keys).size !== keys.length) { e.preventDefault(); err.textContent = 'Hay variantes repetidas (mismo talle y color).'; return; }
  const p = editing || {id: uid(), variants: []};
  Object.assign(p, {name: f.name.value.trim(), cat: f.cat.value.trim(), brand: f.brand.value.trim(), cost: Math.max(0, +f.cost.value || 0), price: Math.max(0, +f.price.value || 0)});
  const old = new Map(p.variants.map(v => [v.id, v]));
  p.variants = vs.map(v => v.id && old.has(v.id)
    ? Object.assign(old.get(v.id), {size: v.size, color: v.color, min: v.min})
    : {id: uid(), size: v.size, color: v.color, qty: 0, min: v.min});
  if (!editing) db.products.push(p);
  vs.forEach((v, i) => { if (!v.id && v.qty > 0) move(p.id, p.variants[i].id, 'in', v.qty, 'Stock inicial'); });
  save(); render();
});

/* ---------- movimiento ---------- */
let cur = null;
function openMove(key){
  const [pid, vid] = key.split('|'); cur = {pid, vid};
  const p = db.products.find(x => x.id === pid), v = p.variants.find(x => x.id === vid);
  $('#dmt').textContent = `${p.name} — ${vlabel(v)} (stock ${v.qty})`;
  $('#fm').reset(); $('#em').textContent = ''; $('#dm').showModal();
}
$('#fm').addEventListener('submit', e => {
  if (e.submitter?.value !== 'ok') return;
  const f = e.target.elements, r = move(cur.pid, cur.vid, f.type.value, f.qty.value, f.note.value.trim());
  if (typeof r === 'string') { e.preventDefault(); $('#em').textContent = r; return; }
  flash = cur.vid; render();
});

/* ---------- eventos ---------- */
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
document.querySelector('nav').onclick = e => { const t = e.target.closest('button')?.dataset.tab; if (t && t !== tab) { tab = t; anim = true; render(); } };
/* ---------- etiquetas ---------- */
// Code 39 (1 = ancho, 0 = angosto; barra/espacio alternados). Lo leen todos los lectores comunes.
const C39 = {0:'000110100',1:'100100001',2:'001100001',3:'101100000',4:'000110001',5:'100110000',6:'001110000',7:'000100101',8:'100100100',9:'001100100',A:'100001001',B:'001001001',C:'101001000',D:'000011001',E:'100011000',F:'001011000',G:'000001101',H:'100001100',I:'001001100',J:'000011100',K:'100000011',L:'001000011',M:'101000010',N:'000010011',O:'100010010',P:'001010010',Q:'000000111',R:'100000110',S:'001000110',T:'000010110',U:'110000001',V:'011000001',W:'111000000',X:'010010001',Y:'110010000',Z:'011010000','*':'010010100'};
function barcode(text){
  let x = 0, bars = '';
  for (const ch of '*' + text + '*') {
    const pat = C39[ch]; if (!pat) continue;
    for (let i = 0; i < 9; i++) { const w = pat[i] === '1' ? 3 : 1; if (i % 2 === 0) bars += `<rect x="${x}" width="${w}" height="1"/>`; x += w; }
    x += 1; // espacio angosto entre caracteres
  }
  return `<svg viewBox="0 0 ${x - 1} 1" preserveAspectRatio="none" shape-rendering="crispEdges" aria-hidden="true">${bars}</svg>`;
}
const lin = () => [...document.querySelectorAll('#lrows input')];
$('#lb').onclick = () => {
  $('#el').textContent = '';
  $('#lrows').innerHTML = rows().map(({p,v}) => `<div class="lrow"><div>${esc(p.name)}<small>${esc(vlabel(v))} · stock ${v.qty} · ${money(p.price)}</small></div>
    <input type="number" min="0" max="200" step="1" value="0" data-vid="${v.id}" data-stock="${v.qty}" aria-label="Copias de ${esc(p.name)} ${esc(vlabel(v))}"></div>`).join('')
    || empty('tag', 'Primero cargá productos.');
  $('#dl').showModal();
};
$('#lstock').onclick = () => lin().forEach(i => i.value = Math.min(200, i.dataset.stock));
$('#lclear').onclick = () => lin().forEach(i => i.value = 0);
$('#lgo').onclick = () => {
  const byId = new Map(rows().map(r => [r.v.id, r])), out = [];
  lin().forEach(i => {
    const n = Math.min(200, Math.max(0, Math.floor(+i.value) || 0)), {p, v} = byId.get(i.dataset.vid);
    for (let k = 0; k < n; k++) out.push(`<div class="lab"><div><b>${esc(p.name)}</b><span class="v">${esc(vlabel(v))}</span></div>
      <div class="p">${money(p.price)}</div><div class="bc">${barcode(v.id.toUpperCase())}</div><div class="c"><span>${esc(p.brand || p.cat)}</span><span>${esc(v.id.toUpperCase())}</span></div></div>`);
  });
  if (!out.length) { $('#el').textContent = 'Indicá al menos una copia.'; return; }
  const [w, h] = $('#lsize').value.split('x'), P = $('#print');
  P.style.setProperty('--lw', w + 'mm'); P.style.setProperty('--lh', h + 'mm'); P.innerHTML = out.join('');
  $('#dl').close();
  requestAnimationFrame(() => print());
};
addEventListener('afterprint', () => { $('#print').innerHTML = ''; });

/* ---------- PWA ---------- */
let ip = null;
const inst = $('#inst'), standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)) inst.hidden = false; // iOS no tiene prompt: se muestra la guía
addEventListener('beforeinstallprompt', e => { e.preventDefault(); ip = e; if (!standalone) inst.hidden = false; });
addEventListener('appinstalled', () => { ip = null; inst.hidden = true; });
inst.onclick = async () => {
  if (ip) { ip.prompt(); await ip.userChoice; ip = null; inst.hidden = true; }
  else alert('En iPhone: tocá Compartir y elegí “Añadir a pantalla de inicio”.');
};
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});

const more = document.querySelector('.more');
more.addEventListener('click', e => { if (e.target.closest('.mi')) more.open = false; });
document.addEventListener('click', e => { if (!more.contains(e.target)) more.open = false; });
$('#th').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('stock_theme', t); } catch {}
};
$('#new').onclick = () => openProduct();
$('#addv').onclick = () => vrow();
$('#view').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.sell) {
    const [p, v] = b.dataset.sell.split('|'), m = move(p, v, 'out', 1, 'Venta rápida'); flash = v; render();
    if (typeof m !== 'string') toast(`Vendido: ${m.name} (${m.var})`, () => { delMove(m.id); render(); });
  }
  else if (b.dataset.mov) openMove(b.dataset.mov);
  else if (b.dataset.edit) openProduct(b.dataset.edit);
  else if (b.dataset.delmov) {
    if (!confirm('¿Eliminar este movimiento? También se revierte su efecto en el stock.')) return;
    const msg = delMove(b.dataset.delmov); if (msg) alert(msg); render();
  }
});
$('#view').addEventListener('input', e => { if (e.target.id === 'q') { filt.q = e.target.value; const pos = e.target.selectionStart; render(); $('#q').focus(); $('#q').setSelectionRange(pos, pos); } });
$('#view').addEventListener('change', e => {
  if (e.target.id === 'fc') filt.cat = e.target.value;
  if (e.target.id === 'fl') filt.low = e.target.checked;
  render();
});

/* ---------- respaldo ---------- */
function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$('#bk').onclick = () => download(`stock-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(db), 'application/json');
$('#csv').onclick = () => {
  const q = v => `"${String(v).replace(/"/g, '""')}"`;
  const head = ['Producto','Categoría','Marca','Talle','Color','Stock','Mínimo','Costo','Precio'];
  const body = rows().map(({p,v}) => [p.name,p.cat,p.brand,v.size,v.color,v.qty,v.min,p.cost,p.price].map(q).join(','));
  download('inventario.csv', '﻿' + [head.map(q).join(','), ...body].join('\r\n'), 'text/csv');
};
$('#rs').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.products) || !Array.isArray(d.moves)) throw 0;
    if (!confirm('Esto reemplaza todos los datos actuales. ¿Continuar?')) return;
    d.moves.forEach(m => m.id ||= uid()); db = d; save(); render();
  } catch { alert('El archivo no es un respaldo válido.'); }
};
render();
</script>
</body>
</html>
